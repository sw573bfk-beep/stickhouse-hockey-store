<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StickHouse — Field Hockey</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f5f2;color:#101510}header{height:72px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 5%;gap:28px;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:900;white-space:nowrap}nav{display:flex;gap:5px;flex:1}nav button{border:0;background:none;padding:10px 13px;font-weight:700;cursor:pointer;border-radius:8px}nav button:hover{background:#edf4ee}.cart{background:#111;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:800;cursor:pointer}.hero{max-width:1200px;margin:24px auto;padding:65px;background:#173b25;color:#fff;border-radius:25px;display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:65px;line-height:.95;margin:12px 0}.hero span{color:#c2ff70}.hero p{max-width:550px;font-size:17px;line-height:1.5;color:#d8e5db}.hero .stick{font-size:150px;transform:rotate(-18deg)}.cta{background:#c2ff70;border:0;border-radius:10px;padding:14px 20px;font-weight:900;cursor:pointer}.controls{max-width:1200px;margin:25px auto;display:flex;gap:12px}.search{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;flex:1}.search input{border:0;outline:0;width:90%;font-size:15px}.controls select{border:1px solid #ddd;border-radius:10px;padding:0 14px;background:#fff}.products{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid #e0e4df;border-radius:16px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 15px 35px #00000012}.image{height:190px;background:#e9eee9;display:grid;place-items:center;font-size:80px}.info{padding:15px}.brand{font-size:11px;color:#68756b;letter-spacing:1px;text-transform:uppercase;font-weight:bold}.name{font-weight:800;margin:7px 0;min-height:40px}.price{font-size:20px;font-weight:900;margin:10px 0}.stock{font-size:12px;color:#218143;margin-bottom:12px}.add{width:100%;padding:11px;border:0;border-radius:9px;background:#173b25;color:#fff;font-weight:800;cursor:pointer}.drawer{position:fixed;right:-430px;top:0;width:430px;max-width:100%;height:100%;background:#fff;z-index:10;transition:.25s;padding:22px;box-shadow:-10px 0 30px #0002}.drawer.open{right:0}.drawer-head{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding-bottom:15px}.drawer-head button{border:0;background:none;font-size:20px}.item{display:grid;grid-template-columns:45px 1fr auto;gap:10px;padding:14px 0;border-bottom:1px solid #eee}.thumb{width:45px;height:45px;background:#edf2ed;border-radius:8px;display:grid;place-items:center}.qty button{border:1px solid #ddd;background:#fff;border-radius:5px}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:900;margin:20px 0}.checkout{width:100%;padding:14px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:900;cursor:pointer}.backdrop{position:fixed;inset:0;background:#0008;z-index:9;display:none}.backdrop.show{display:block}footer{text-align:center;padding:40px;color:#718078}@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr);padding:0 15px}.hero{margin:15px;padding:40px}.hero h1{font-size:48px}.hero .stick{font-size:90px}nav{display:none}}@media(max-width:550px){.products{grid-template-columns:1fr}.controls{margin:15px;flex-direction:column}.hero .stick{display:none}}
</style></head>
<body>
<header><div class="logo">🏑 STICKHOUSE</div><nav id="nav"></nav><button class="cart" onclick="openCart()">Cart (<span id="count">0</span>)</button></header>
<section class="hero"><div><small>FIELD HOCKEY / AUSTRALIA</small><h1>PLAY<br><span>FASTER.</span></h1><p>Premium field hockey gear for training, match day and everything between.</p><button class="cta" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">SHOP NOW →</button></div><div class="stick">🏑</div></section>
<div class="controls"><div class="search">🔎 <input id="search" placeholder="Search hockey gear..."></div><select id="sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div>
<section class="products" id="products"></section>
<div class="backdrop" id="backdrop" onclick="closeCart()"></div><aside class="drawer" id="drawer"><div class="drawer-head"><h2>Your Cart</h2><button onclick="closeCart()">✕</button></div><div id="items"></div><div class="total"><span>Total</span><span id="total">$0.00</span></div><button class="checkout" onclick="alert('Demo checkout. Add Stripe keys to enable real payments.')">CHECKOUT</button></aside>
<footer>© 2026 StickHouse — Original demo ecommerce store</footer>
<script>
const products=[
['Grays','GX 1000 Ultrabow Hockey Stick','Sticks',129.99,'🏑',13],['Gryphon','Solo Pro25 G25 Hockey Stick','Sticks',200,'🏑',25],['Kookaburra','Atom Hockey Stick','Sticks',275,'🏑',6],['FORZA','F100 Fibreglass Stick','Sticks',79.99,'🏑',10],['ASICS','Gel Peake Hockey Shoes','Shoes',109.95,'👟',25],['Grays','Burner Hockey Shoes','Shoes',99.95,'👟',25],['Kookaburra','Impulse Hockey Shoes','Shoes',49.95,'👟',25],['Grays','G500 Hockey Shinguards','Protection',29.95,'🛡️',23],['Gryphon','Classic G4 Shinguards','Protection',34.95,'🛡️',25],['Grays','Skinfit Hockey Gloves','Protection',19.95,'🧤',10],['Kookaburra','Revoke Shell Glove','Protection',35,'🧤',12],['Grays','G350 Duffle Stick Bag','Bags',49.95,'🎒',6],['Gryphon','Finnie Hockey Bag','Bags',125,'🎒',25],['Kookaburra','Atom Hockey Bag','Bags',140,'🎒',3],['Grays','Match Crater Hockey Ball','Accessories',9.95,'⚪',12],['Gryphon','Chamois Grip','Accessories',9.95,'🌀',4],['Kookaburra','Chamois Grip','Accessories',9.95,'🌀',11],['Fox40','Classic Whistle','Accessories',14.95,'📣',25]];
let cart=JSON.parse(localStorage.getItem('stickhouse-cart')||'{}'),cat='All';
const money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(n);
function renderNav(){let cats=['All','Sticks','Shoes','Protection','Bags','Accessories'];document.getElementById('nav').innerHTML=cats.map(c=>`<button onclick="setCat('${c}')">${c}</button>`).join('')}
function render(){let q=document.getElementById('search').value.toLowerCase(),list=products.map((p,i)=>({...p,i})).filter(p=>(cat==='All'||p[2]===cat)&&(`${p[0]} ${p[1]}`.toLowerCase().includes(q)));let s=document.getElementById('sort').value;if(s==='low')list.sort((a,b)=>a[3]-b[3]);if(s==='high')list.sort((a,b)=>b[3]-a[3]);document.getElementById('products').innerHTML=list.map(p=>`<article class="card"><div class="image">${p[4]}</div><div class="info"><div class="brand">${p[0]} • ${p[2]}</div><div class="name">${p[1]}</div><div class="price">${money(p[3])}</div><div class="stock">● In stock (${p[5]})</div><button class="add" onclick="add(${p.i})">ADD TO CART</button></div></article>`).join('');renderCart()}
function setCat(c){cat=c;render()}
function add(i){cart[i]=(cart[i]||0)+1;save();render();openCart()}
function change(i,d){cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];save();render()}
function save(){localStorage.setItem('stickhouse-cart',JSON.stringify(cart))}
function renderCart(){let keys=Object.keys(cart),count=keys.reduce((s,i)=>s+cart[i],0);document.getElementById('count').textContent=count;let total=0;document.getElementById('items').innerHTML=keys.length?keys.map(i=>{let p=products[i],v=p[3]*cart[i];total+=v;return `<div class="item"><div class="thumb">${p[4]}</div><div><b>${p[1]}</b><br>${money(p[3])}<div class="qty"><button onclick="change(${i},-1)">−</button> ${cart[i]} <button onclick="change(${i},1)">+</button></div></div><b>${money(v)}</b></div>`}).join(''):'<p>Your cart is empty.</p>';document.getElementById('total').textContent=money(total)}
function openCart(){document.getElementById('drawer').classList.add('open');document.getElementById('backdrop').classList.add('show')}function closeCart(){document.getElementById('drawer').classList.remove('open');document.getElementById('backdrop').classList.remove('show')}
document.getElementById('search').oninput=render;document.getElementById('sort').onchange=render;renderNav();render();
</script></body></html>
